# DOC-SOURCES.yml
# Doc-source manifest for regulatory-ingredients-labels-laws (Phase 8 E8.3
# wave 1 backfill, F7.1.2). Maps each managed document to the sources it derives
# from and how it is maintained. When the harness drift tooling
# (harness/hooks/check-doc-drift.py, /docs-sync) is wired into this repo it
# reads this file; until then the manifest is the declared source-of-truth map.
#
# class:
#   derived  - regenerable from sources; /docs-sync overwrites it in place.
#   authored - human judgment; /docs-sync NEVER overwrites. On drift it flags
#              and proposes a patch behind a review gate.
#
# sources: paths relative to repo root. A trailing slash means "any file under
#   this directory". A doc is stale when any source changed more recently than
#   the doc itself.
#
# Every document here is authored (regulatory research and operating docs, not
# machine-regenerated), so drift only flags for review; nothing is overwritten.

version: 1

docs:
  - path: README.md
    class: authored
    sources:
      - project.yml

  - path: CLAUDE.md
    class: authored
    sources:
      - project.yml

  - path: public/regwatch/regwatch-troubleshooting.md
    class: authored
    sources:
      - scripts/regwatch.py
      - public/regwatch/
