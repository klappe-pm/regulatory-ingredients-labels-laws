name: regwatch-weekly

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate the register
        run: make regwatch-validate
      - name: Restore last-seen state
        uses: actions/cache@v4
        with:
          path: public/regwatch/state/regwatch-seen.json
          key: regwatch-seen-${{ github.run_id }}
          restore-keys: |
            regwatch-seen-
      - name: Scan sources and accept new baseline
        run: python3 scripts/regwatch.py scan --live --update
      - name: Ingest the live Federal Register feed
        run: python3 scripts/regwatch.py ingest --live --since 365
      - name: Render the change-and-due report
        run: python3 scripts/regwatch.py report --window 365 --out out/regwatch-report.md --json out/regwatch-report.json
      - name: Render the weekly brief in every format
        run: python3 scripts/regwatch.py brief --cadence weekly --out-dir out
      - name: Render the human-readable briefing
        run: python3 scripts/regwatch.py briefing --out out/regwatch-fda-beverage-briefing.md
      - name: Stage ingest candidates for the artifact
        run: cp public/regwatch/state/regwatch-ingest-candidates.json out/ || true
      - name: Upload weekly outputs
        uses: actions/upload-artifact@v4
        with:
          name: regwatch-weekly
          path: out/
