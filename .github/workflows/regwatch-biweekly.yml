name: regwatch-biweekly

# The bi-weekly team report. GitHub cron cannot express "every two weeks", so it
# fires every Monday and a gate job runs the report only on even weeks (a stable
# 14-day cadence anchored to the Unix epoch). workflow_dispatch always runs.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( ($(date -u +%s) / 604800) % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running the bi-weekly report."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off week; skipping the bi-weekly report."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate the register
        run: make regwatch-validate
      - name: Restore last-seen state
        uses: actions/cache@v4
        with:
          path: regwatch/state/regwatch-seen.json
          key: regwatch-seen-${{ github.run_id }}
          restore-keys: |
            regwatch-seen-
      - name: Scan sources and accept new baseline
        run: python3 scripts/regwatch.py scan --live --update
      - name: Ingest the live Federal Register feed
        run: python3 scripts/regwatch.py ingest --live --since 21
      - name: Render the tiered reports (last 14 days)
        run: |
          mkdir -p out
          for tier in v1 v2 v3; do
            python3 scripts/regwatch.py briefing --tier "$tier" --since-days 14 --out "out/regwatch-rollout-$tier-report.md"
          done
      - name: Regenerate the newsletter and the records export
        run: |
          python3 scripts/regwatch.py newsletter --out out/regwatch-newsletter.md
          python3 scripts/regwatch.py export --csv out/regwatch-records-export.csv --json out/regwatch-records-export.json
      - name: Include the team one-pager
        run: cp docs/reports/regwatch-rollout/regwatch-rollout-one-pager.md out/ || true
      - name: Stage ingest candidates
        run: cp regwatch/state/regwatch-ingest-candidates.json out/ || true
      - name: Upload the bi-weekly report
        uses: actions/upload-artifact@v4
        with:
          name: regwatch-biweekly
          path: out/
