name: leak-gate

# Deterministic secret and dependency/IaC scanning for this repo, mirroring the
# harness code-analysis.yml security spine (Phase 8 E8.3 wave 1, F1.3.2). Two
# jobs: gitleaks over full history and trivy filesystem scan. Landed alongside
# the least-privilege container migration so leaks surface identically in CI and
# at commit time.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists PR commits via the REST API

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal and public repos need no license; org-owned private repos
          # require a (free) GITLEAKS_LICENSE. See the gitleaks-action README.
          # The post-scan SARIF artifact upload can hit the account's artifact
          # storage quota (CreateArtifact -> "storage quota has been hit").
          # Nothing consumes the artifact here, so disable the upload.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependencies:
    name: trivy (deps + IaC + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
